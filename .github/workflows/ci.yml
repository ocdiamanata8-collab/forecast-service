# Verifikasi repo pada setiap push/PR — tanpa secret (conftest hermetic).
#
# Workflow terjadwal (forecast-jobs, forecast-monitor, db-backup) membutuhkan
# DATABASE_URL / API key produksi; job ini memastikan perubahan kode + guard
# hygiene (termasuk literal API key di file ter-commit) tetap hijau di runner
# GitHub sebelum deploy.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Pasang dependensi terkunci + pytest (dev, tidak di requirements.txt)
        run: pip install -r requirements.txt pytest==9.1.1

      - name: Audit kebersihan repo
        run: python scripts/check_repo_hygiene.py

      - name: Pytest (suite hermetic)
        run: python -m pytest tests/ -q
